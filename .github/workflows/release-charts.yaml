name: Release Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
  workflow_dispatch: {}

jobs:
  release:
    name: Package & publish charts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package and publish charts
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/helm-charts
        run: |
          mkdir -p /tmp/packaged-charts
          publish_count=0
          skip_count=0

          for chart_dir in charts/*/; do
            [ -f "${chart_dir}Chart.yaml" ] || continue

            chart_name=$(helm show chart "$chart_dir" | awk '/^name:/{print $2}')
            chart_version=$(helm show chart "$chart_dir" | awk '/^version:/{print $2}')

            echo "──────────────────────────────────────────────"
            echo "  Chart   : ${chart_name}"
            echo "  Version : ${chart_version}"
            echo "  Source  : ${chart_dir}"

            # Skip if this exact version is already in the registry.
            # helm pull exits 0 on success, non-zero if the tag does not exist.
            if helm pull "oci://${REGISTRY}/${chart_name}" \
                --version "${chart_version}" \
                --destination /tmp/check \
                2>/dev/null; then
              echo "  Status  : already published — skipping"
              skip_count=$((skip_count + 1))
              continue
            fi

            helm package "${chart_dir}" --destination /tmp/packaged-charts

            helm push \
              "/tmp/packaged-charts/${chart_name}-${chart_version}.tgz" \
              "oci://${REGISTRY}"

            echo "  Status  : published ✓"
            publish_count=$((publish_count + 1))
          done

          echo "──────────────────────────────────────────────"
          echo "Done. Published: ${publish_count}  Skipped: ${skip_count}"
