# Default values for glitchtip-bootstrap.
#
# A PostSync hook Job runs the GlitchTip image's Django shell against the live
# database to (1) upsert the Authentik OIDC SocialApp and (2) create the shared
# org/project and write its DSN into a Secret consumed by the kart deployments.

image:
  # MUST match the running GlitchTip image (apps/templates/apps/glitchtip.yaml) so the
  # ORM models the script imports line up with the migrated schema.
  repository: glitchtip/glitchtip
  tag: "6.2.0"
  pullPolicy: IfNotPresent

# Django settings module of the GlitchTip backend (used by `manage.py shell`).
djangoSettingsModule: glitchtip.settings

# Full external URL of this GlitchTip instance — needed to render valid DSNs.
glitchtipDomain: "" # e.g. https://glitchtip.example.com

# Secret holding the Django SECRET_KEY (same one the web pods use).
secretKeyRef:
  name: glitchtip-local-secrets
  key: secret-key

# Secret holding the PostgreSQL connection URL (CNPG auto-creates <cluster>-app/uri).
databaseSecret:
  name: glitchtip-postgresql-app
  key: uri

# Valkey/Redis URL (literal). Points at the GlitchTip chart's valkey Service
# (<release>-valkey, auth disabled). Used as a literal rather than the chart's REDIS_URL
# secret because the migrate hook runs before that secret exists; migrations don't use Redis.
redisUrl: "redis://glitchtip-valkey:6379/0"

# Schema migration, run as an ArgoCD Sync hook. The GlitchTip chart's own migrate Job is
# disabled (apps/templates/apps/glitchtip.yaml) because its helm pre-upgrade hook maps to
# ArgoCD PreSync and runs before the secret + DB exist. This runs at wave -1: after the
# secret + CNPG cluster (wave -10), before the web Deployment (wave 0).
migrate:
  enabled: true
  command: ["bin/run-migrate.sh"]
  syncWave: "-1"
  # Retries (with backoff) while the CNPG cluster finishes provisioning.
  backoffLimit: 20

# ── Authentik OIDC SocialApp ───────────────────────────────────────────────────
oidc:
  # allauth provider type (generic OIDC) — do not change.
  provider: openid_connect
  # Machine name of the provider; also the URL slug in the allauth callback:
  #   https://glitchtip.<domain>/accounts/oidc/<providerId>/login/callback/
  providerId: authentik
  # User-facing label on the GlitchTip login page.
  name: Authentik
  # OIDC client_id — must match the `glitchtip` provider in Authentik
  # (authentik/blueprints/08-glitchtip_oidc.yaml).
  clientId: glitchtip
  # OIDC discovery document of the Authentik `glitchtip` application.
  serverUrl: "" # e.g. https://auth.example.com/application/o/glitchtip/.well-known/openid-configuration
  # The shared client secret. Generated by Authentik's secrets-generator
  # (authentik-local-secrets/glitchtip-oidc-secret) and read here so both sides match.
  secretRef:
    name: authentik-local-secrets
    key: glitchtip-oidc-secret

# ── Shared kart project + DSN ──────────────────────────────────────────────────
org:
  name: my-org
project:
  name: my-project

# Secret the bootstrap Job writes the DSN into; consumed by every kart branch/PR
# deployment (apps/templates/apps/kart-branches.yaml, kart-pr.yaml).
dsnSecret:
  name: glitchtip-dsn
  key: SENTRY_DSN

# Periodically add every user to the shared organization so OIDC users get access to the
# kart project automatically (no manual step). Near-real-time: runs on `schedule`, not on
# login. Lower the interval for faster onboarding, or disable if you prefer manual control.
memberSync:
  enabled: true
  schedule: "*/5 * * * *"
  # Organization (slug) users are added to — the org the bootstrap created for the DSN.
  orgSlug: my-org

serviceAccount:
  # When set, overrides the ServiceAccount name. Defaults to the chart fullname (release-aware).
  name: ""

# Runs after the GlitchTip chart's migrate hook (Helm post-install → ArgoCD PostSync,
# default wave 0). The Job also retries internally, so ordering is best-effort.
syncWave: "5"

# Retry budget for the in-Job loop while migrations finish (attempts × delaySeconds).
retries:
  attempts: 60
  delaySeconds: 5

resources:
  requests:
    cpu: 50m
    memory: 128Mi

annotations: {}
labels: {}
