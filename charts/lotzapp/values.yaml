nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

images:
  # Shared image used by lotzapp, migration (initContainer), and webshop.
  app:
    repository: ghcr.io/lotzapp/lotzappv1.0
    tag: branch-docker
    pullPolicy: IfNotPresent
  database:
    repository: mariadb
    tag: "12" # previously just 12
    pullPolicy: IfNotPresent
  ftp:
    repository: crazymax/pure-ftpd
    tag: latest
    pullPolicy: IfNotPresent

networkPolicy:
  enabled: false

serviceAccount:
  create: false
  name: ""

database:
  # Set to false to skip deploying the built-in MariaDB and use an external database instead.
  enabled: true
  rootPassword: "ROOT_PASSWORD"
  storage:
    size: 100Mi
    accessMode: ReadWriteOnce
    storageClassName: ""
  # External database settings — only used when database.enabled is false.
  external:
    host: ""
    port: "3306"
    user: "root"
    password: ""

migration:
  # DB connection is derived from database.* values automatically.
  # Override only if the migration user/password differs from the database credentials.
  mariadbUser: ""
  mariadbPassword: ""
  initialSchemaSql: ""
  initialInsertsSql: ""

lotzapp:
  replicaCount: 1
  command:
    - bash
    - -c
    - apache2-foreground
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: lotzapp.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    data:
      enabled: true
      size: 100Mi
      accessMode: ReadWriteOnce
      storageClassName: ""
    documents:
      enabled: true
      size: 100Mi
      accessMode: ReadWriteOnce
      storageClassName: ""
    images:
      enabled: true
      size: 100Mi
      accessMode: ReadWriteOnce
      storageClassName: ""
    home:
      enabled: true
      size: 100Mi
      accessMode: ReadWriteOnce
      storageClassName: ""
  envFile:
    secretName: lotzapp-env
    key: .env

ftp:
  enabled: false
  replicaCount: 1
  service:
    type: ClusterIP
    controlPort: 2100
    passivePortStart: 30000
    passivePortEnd: 30009
  persistence:
    config:
      enabled: true
      size: 100Mi
      accessMode: ReadWriteOnce
      storageClassName: ""

webshop:
  replicaCount: 1
  command:
    - bash
    - -c
    - apache2-foreground
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: webshop.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  envFile:
    secretName: webshop-env
    key: .env
