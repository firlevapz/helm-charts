nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

images:
  # Shared image used by lotzapp, migration (initContainer), and webshop.
  app:
    repository: ghcr.io/lotzapp/lotzappv1.0
    tag: branch-cloud
    pullPolicy: IfNotPresent
  database:
    repository: mariadb
    tag: "12" # previously just 12
    pullPolicy: IfNotPresent
  ftp:
    repository: crazymax/pure-ftpd
    tag: latest
    pullPolicy: IfNotPresent
  # Minimal Alpine-based image used by cron jobs (has curl + busybox awk).
  cronjob:
    repository: alpine/curl
    tag: "latest"
    pullPolicy: IfNotPresent
  nginx:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent

networkPolicy:
  enabled: false

cronjobs:
  enabled: true
  # In-cluster hostname of the lotzapp webserver.
  # Defaults to the lotzapp service: <release-name>-lotzapp
  webserverHost: ""
  # Keep only the last N successful / failed job pods for log inspection.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  # Prevent a new job from starting if the previous run is still active.
  concurrencyPolicy: Forbid
  jobs:
    - name: send-ar-auto
      schedule: "* * * * *"
      path: /send_ar_auto.php
    - name: webshop-api
      schedule: "*/12 * * * *"
      path: /module/webshop/api.php
    - name: er-mail
      schedule: "37 3 * * *"
      path: /module/er/mail.php
    - name: artikel-send-email
      schedule: "*/30 * * * *"
      path: /module/artikel/send_email.php
    - name: clear-warenkorb
      schedule: "*/15 * * * *"
      path: /shop2/clear_warenkorb.php
    - name: webshop-api-mail
      schedule: "30 3 * * *"
      path: /module/webshop/api_mail.php
    - name: webshop-create-termine
      schedule: "30 1 * * *"
      path: /module/webshop/create_termine.php
    - name: webshop-bestellungen-create
      schedule: "*/3 * * * *"
      path: /module/webshop/bestellungen_create.php

serviceAccount:
  create: false
  name: ""

database:
  # Set to false to skip deploying the built-in MariaDB and use an external database instead.
  enabled: true
  rootPassword: "ROOT_PASSWORD"
  storage:
    size: 100Mi
    accessMode: ReadWriteOnce
    storageClassName: ""
  # External database settings — only used when database.enabled is false.
  external:
    host: ""
    port: "3306"
    user: "root"
    password: ""

migration:
  # DB connection is derived from database.* values automatically.
  # Override only if the migration user/password differs from the database credentials.
  mariadbUser: ""
  mariadbPassword: ""
  initialSchemaSql: ""
  initialInsertsSql: ""

lotzapp:
  replicaCount: 1
  command:
    - bash
    - -c
    - apache2-foreground
  nginx:
    enabled: true
    replicaCount: 1
    # FastCGI upstream for PHP-FPM — defaults to <release>-lotzapp:<phpFpmPort>
    fastcgiPass: ""
    # Port the lotzapp container exposes for PHP-FPM.
    phpFpmPort: 9000
    service:
      type: ClusterIP
      port: 80
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: lotzapp.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    data:
      enabled: true
      size: 100Mi
      accessMode: ReadWriteOnce
      storageClassName: ""
    documents:
      enabled: true
      size: 100Mi
      accessMode: ReadWriteOnce
      storageClassName: ""
    images:
      enabled: true
      size: 100Mi
      accessMode: ReadWriteOnce
      storageClassName: ""
    home:
      enabled: true
      size: 100Mi
      accessMode: ReadWriteOnce
      storageClassName: ""
  env:
    # Application
    ENVIRONMENT: "Dev"
    ERROR_REPORTING: "ON"
    ERROR_LOG_FILE: ""
    # Server — leave SERVER_URL empty to auto-derive: http://<lotzapp ingress host>
    SERVER_ID: "7"
    AUTO_LOGIN: "0"
    SERVER_URL: ""
    SERVER_NAME: "LotzApp"
    # Database — leave DB_HOST/USER/PASSWORD empty to auto-derive from database.*
    DB_HOST: ""
    DB_USER: ""
    DB_PASSWORD: ""
    DB_NAME: "lotzapp"
    # FTP Database — defaults to the same connection as the main DB
    FTP_DB_HOST: ""
    FTP_DB_USER: ""
    FTP_DB_PASSWORD: ""
    FTP_DB_NAME: "lotzapp"
    FTP_DB_PORT: "" # auto-derived from database.*
    # Permissions
    FILE_PERMISSION: "0777"
    FOLDER_PERMISSION: "0777"
    # PDF Formular
    FORMULAR_BASE: "https://develop.lotzapp.dev"
    FORMULAR_SERVER_TWO_BASE: "http://192.168.250.53/lotzapp"
    FORMULAR_WORK_SERVER_BASE: "https://form.develop.lotzapp.dev"
    # Session
    SESSION_TIMEOUT: "1200"
    # Webshop — leave SHOP_URL empty to auto-derive: https://<webshop ingress host>/shop
    SHOP_URL: ""
    # Authentication
    AUTHENTICATION_URL: "https://id.develop.lotzapp.dev"
    # Cashpoint
    CASHPOINT_URL: "cashpoint:50051"
    CASHPOINT_WEBHOOK_USER: "cashpoint"
    CASHPOINT_WEBHOOK_PASSWORD: "cashpoint"
    # Email
    EMAIL_BCC_ADDRESS: "emolotz@gmail.com"
    EMAIL_TEST_ADDRESS: "emolotz@gmail.com"
    MAIL_SMTP: "lotzapp.org"
    MAIL_PASSWORD: "lotzapp123"
    MAIL_USERNAME: "LOTZAPP"
    SMTP_SSL_MNDT: "0"
    SMTP_SSL_PORT: "465"
    # Password Reset
    RESET_CODE_LOTZAPP: "rwV3LD8fCZn29AFQxsXpvfZ_ZTTXnyqA"
  envFile:
    # Leave secretName empty to use the chart-generated secret (recommended).
    # Set to an existing Secret name to supply a fully custom .env instead.
    secretName: ""
    key: .env

ftp:
  enabled: false
  replicaCount: 1
  service:
    type: ClusterIP
    controlPort: 2100
    passivePortStart: 30000
    passivePortEnd: 30009
  persistence:
    config:
      enabled: true
      size: 100Mi
      accessMode: ReadWriteOnce
      storageClassName: ""

webshop:
  enabled: false
  replicaCount: 1
  command:
    - bash
    - -c
    - apache2-foreground
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: webshop.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  env:
    DYNAMIC_SHOP: "TRUE"
    # Leave SERVER_URL empty to auto-derive: http://<lotzapp ingress host>/shop_v2
    SERVER_URL: ""
    SERVER_PATH: "index.php"
    # Leave SHOP_URL empty to auto-derive: http://<webshop ingress host>/shop_v2/
    SHOP_URL: ""
    SHOP_ID: "0"
  envFile:
    # Leave secretName empty to use the chart-generated secret (recommended).
    # Set to an existing Secret name to supply a fully custom .env instead.
    secretName: ""
    key: .env
