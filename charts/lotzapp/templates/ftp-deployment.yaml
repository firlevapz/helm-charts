apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-lotzapp-ftp"
  labels:
    app.kubernetes.io/name: lotzapp
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: ftp
spec:
  replicas: {{ .Values.ftp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lotzapp
      app.kubernetes.io/instance: "{{ .Release.Name }}"
      app.kubernetes.io/component: ftp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lotzapp
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: ftp
    spec:
      containers:
        - name: ftp
          image: "{{ .Values.images.ftp.repository }}:{{ .Values.images.ftp.tag }}"
          imagePullPolicy: {{ .Values.images.ftp.pullPolicy }}
          env:
            - name: AUTH_METHOD
              value: mysql
          ports:
            - name: ftp-control
              containerPort: 2100
              protocol: TCP
            - name: ftp-passive-30000
              containerPort: 30000
              protocol: TCP
            - name: ftp-passive-30001
              containerPort: 30001
              protocol: TCP
            - name: ftp-passive-30002
              containerPort: 30002
              protocol: TCP
            - name: ftp-passive-30003
              containerPort: 30003
              protocol: TCP
            - name: ftp-passive-30004
              containerPort: 30004
              protocol: TCP
            - name: ftp-passive-30005
              containerPort: 30005
              protocol: TCP
            - name: ftp-passive-30006
              containerPort: 30006
              protocol: TCP
            - name: ftp-passive-30007
              containerPort: 30007
              protocol: TCP
            - name: ftp-passive-30008
              containerPort: 30008
              protocol: TCP
            - name: ftp-passive-30009
              containerPort: 30009
              protocol: TCP
          volumeMounts:
            - name: ftp-config
              mountPath: /data
            - name: documents
              mountPath: /ftpdata/documents
            - name: data
              mountPath: /ftpdata/data
      volumes:
        - name: ftp-config
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-lotzapp-ftp-config"
        - name: documents
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-lotzapp-documents"
        - name: data
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-lotzapp-data"
