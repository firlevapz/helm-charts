{{- if .Values.lotzapp.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ .Release.Name }}-lotzapp-data"
  labels:
    app.kubernetes.io/name: lotzapp
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: lotzapp
spec:
  accessModes:
    - {{ .Values.lotzapp.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.lotzapp.persistence.size | quote }}
  {{- if .Values.lotzapp.persistence.storageClassName }}
  storageClassName: {{ .Values.lotzapp.persistence.storageClassName | quote }}
  {{- end }}
{{- end }}
