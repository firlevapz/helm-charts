{{- if .Values.lotzapp.nginx.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-lotzapp-nginx"
  labels:
    app.kubernetes.io/name: lotzapp
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: nginx
spec:
  type: {{ .Values.lotzapp.nginx.service.type }}
  ports:
    - name: http
      port: {{ .Values.lotzapp.nginx.service.port }}
      targetPort: 80
      protocol: TCP
  selector:
    app.kubernetes.io/name: lotzapp
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: nginx
{{- end }}
