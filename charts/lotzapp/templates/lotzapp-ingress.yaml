{{- if .Values.lotzapp.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Release.Name }}-lotzapp"
  labels:
    app.kubernetes.io/name: lotzapp
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: lotzapp
  {{- with .Values.lotzapp.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.lotzapp.ingress.className }}
  ingressClassName: {{ .Values.lotzapp.ingress.className }}
  {{- end }}
  {{- if .Values.lotzapp.ingress.tls }}
  tls:
    {{- toYaml .Values.lotzapp.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.lotzapp.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if $.Values.lotzapp.nginx.enabled }}
                name: "{{ $.Release.Name }}-lotzapp-nginx"
                port:
                  number: {{ $.Values.lotzapp.nginx.service.port }}
                {{- else }}
                name: "{{ $.Release.Name }}-lotzapp"
                port:
                  number: {{ $.Values.lotzapp.service.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
