{{- $computed := dict
    "SERVER_URL" (.Values.webshop.env.SERVER_URL | default (printf "http://%s/shop_v2" (index .Values.lotzapp.ingress.hosts 0).host))
    "SHOP_URL"   (.Values.webshop.env.SHOP_URL   | default (printf "http://%s/shop_v2/" (index .Values.webshop.ingress.hosts 0).host))
}}
{{- $env := merge $computed .Values.webshop.env }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-webshop-env"
  labels:
    app.kubernetes.io/name: lotzapp
    app.kubernetes.io/instance: "{{ .Release.Name }}"
type: Opaque
stringData:
  .env: |{{ range $key, $val := $env }}
    {{ $key }}={{ $val }}
{{- end }}
