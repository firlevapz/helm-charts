{{- if .Values.lotzapp.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "{{ .Release.Name }}-lotzapp"
  labels:
    app.kubernetes.io/name: lotzapp
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: lotzapp
  {{- with .Values.lotzapp.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.lotzapp.httproute.parentRefs | nindent 4 }}
  {{- if .Values.lotzapp.httproute.hostnames }}
  hostnames:
    {{- toYaml .Values.lotzapp.httproute.hostnames | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        {{- if .Values.lotzapp.nginx.enabled }}
        - name: "{{ .Release.Name }}-lotzapp-nginx"
          port: {{ .Values.lotzapp.nginx.service.port }}
        {{- else }}
        - name: "{{ .Release.Name }}-lotzapp"
          port: {{ .Values.lotzapp.service.port }}
        {{- end }}
{{- end }}
