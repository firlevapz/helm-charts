{{- /* Resolve auto-derived values; explicit overrides in lotzapp.env take precedence via default */}}
{{- $dbHost     := .Values.lotzapp.env.DB_HOST     | default (include "lotzapp.databaseHost" .) }}
{{- $dbUser     := .Values.lotzapp.env.DB_USER     | default (include "lotzapp.databaseUser" .) }}
{{- $dbPassword := .Values.lotzapp.env.DB_PASSWORD | default (include "lotzapp.databasePassword" .) }}
{{- $computed := dict
    "DB_HOST"        $dbHost
    "DB_USER"        $dbUser
    "DB_PASSWORD"    $dbPassword
    "FTP_DB_HOST"    (.Values.lotzapp.env.FTP_DB_HOST | default $dbHost)
    "FTP_DB_USER"    (.Values.lotzapp.env.FTP_DB_USER | default $dbUser)
    "FTP_DB_PASSWORD" (.Values.lotzapp.env.FTP_DB_PASSWORD | default $dbPassword)
    "FTP_DB_PORT"    (.Values.lotzapp.env.FTP_DB_PORT | default (include "lotzapp.databasePort" .))
    "SERVER_URL"     (.Values.lotzapp.env.SERVER_URL  | default (printf "http://%s" (index .Values.lotzapp.ingress.hosts 0).host))
    "SHOP_URL"       (.Values.lotzapp.env.SHOP_URL    | default (printf "https://%s/shop" (index .Values.webshop.ingress.hosts 0).host))
}}
{{- /* Merge: $computed values win for their keys; all other lotzapp.env keys are added as-is */}}
{{- $env := merge $computed .Values.lotzapp.env }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-lotzapp-env"
  labels:
    app.kubernetes.io/name: lotzapp
    app.kubernetes.io/instance: "{{ .Release.Name }}"
type: Opaque
stringData:
  .env: |{{ range $key, $val := $env }}
    {{ $key }}={{ $val }}
{{- end }}
