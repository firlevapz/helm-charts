{{- if .Values.database.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-lotzapp-database"
  labels:
    app.kubernetes.io/name: lotzapp
    app.kubernetes.io/instance: "{{ .Release.Name }}"
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.database.rootPassword | quote }}
{{- end }}
