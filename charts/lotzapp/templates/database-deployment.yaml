apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-lotzapp-database"
  labels:
    app.kubernetes.io/name: lotzapp
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lotzapp
      app.kubernetes.io/instance: "{{ .Release.Name }}"
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lotzapp
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: database
          image: "{{ .Values.images.database.repository }}:{{ .Values.images.database.tag }}"
          imagePullPolicy: {{ .Values.images.database.pullPolicy }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-lotzapp-database"
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/mysql
      volumes:
        - name: database-data
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-lotzapp-database-data"
