{{- if .Values.lotzapp.nginx.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-lotzapp-nginx"
  labels:
    app.kubernetes.io/name: lotzapp
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.lotzapp.nginx.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lotzapp
      app.kubernetes.io/instance: "{{ .Release.Name }}"
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lotzapp
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: nginx
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Copy the application source from the app image into a shared emptyDir
        # so nginx can serve static assets — equivalent to the lotzapp-source
        # named volume in docker-compose.
        - name: init-source
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - cp -r /var/www/html/. /source/
          volumeMounts:
            - name: source
              mountPath: /source
      containers:
        - name: nginx
          image: "{{ .Values.images.nginx.repository }}:{{ .Values.images.nginx.tag }}"
          imagePullPolicy: {{ .Values.images.nginx.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: source
              mountPath: /var/www/html
            - name: data
              mountPath: /var/www/html/data
            - name: documents
              mountPath: /var/www/html/documents
            - name: images
              mountPath: /var/www/html/images
            - name: home
              mountPath: /var/www/html/home
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: source
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-lotzapp-data"
        - name: documents
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-lotzapp-documents"
        - name: images
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-lotzapp-images"
        - name: home
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-lotzapp-home"
        - name: nginx-conf
          configMap:
            name: "{{ .Release.Name }}-lotzapp-nginx-conf"
{{- end }}
