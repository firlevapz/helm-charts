# Per-node agent (DaemonSet):
#   - tails ALL container logs from the node (filelog) -> logs
#   - scrapes kubelet for node/pod/container metrics (kubeletstats) -> metrics
#   - receives OTLP from apps on the node (traces + app metrics + app logs)
#   - enriches everything with k8s metadata and ships it to your remote endpoint.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: agent
  namespace: observability
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:latest
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      memory: "256Mi"
  serviceAccount: otel-collector
  env:
    - name: OTLP_TOKEN
      valueFrom:
        secretKeyRef:
          name: otlp-export
          key: token
    - name: OTLP_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: otlp-export
          key: endpoint
    - name: K8S_CLUSTER_NAME
      valueFrom:
        secretKeyRef:
          name: otlp-export
          key: cluster
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_NAME}:10250"
        insecure_skip_verify: true
        metric_groups: [node, pod, container]
      filelog:
        include: ["/var/log/pods/*/*/*.log"]
        include_file_path: true
        start_at: end
        operators:
          - type: container
            id: container-parser
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.container.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
      resourcedetection:
        detectors: [env, system]
        override: false
      # Stamp the cluster name onto every signal (traces/metrics/logs) so Loki,
      # Mimir and Tempo can distinguish data from different clusters. Value comes
      # from the per-cluster otlp-export secret (key: cluster).
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: "${env:K8S_CLUSTER_NAME}"
            action: upsert
      batch:
        send_batch_size: 8192
        send_batch_max_size: 16384
        timeout: 10s
    exporters:
      otlphttp:
        endpoint: "${env:OTLP_ENDPOINT}"
        compression: gzip
        headers:
          authorization: "Bearer ${env:OTLP_TOKEN}"
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          queue_size: 10000
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource/cluster, batch]
          exporters: [otlphttp]
        metrics:
          receivers: [otlp, kubeletstats]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource/cluster, batch]
          exporters: [otlphttp]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource/cluster, batch]
          exporters: [otlphttp]
