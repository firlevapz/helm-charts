apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "authentik-application.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "authentik-application.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWave | quote }}
    {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  upsert.sh: |
    {{- include "authentik-application.upsertScript" . | nindent 4 }}
  delete.sh: |
    {{- include "authentik-application.deleteScript" . | nindent 4 }}
