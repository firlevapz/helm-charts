# PostSync hook: create/update the Application after the release's workloads sync, so
# the portal tile appears once the target is actually deployed. hook-delete-policy
# BeforeHookCreation re-runs it on every sync (idempotent) and keeps it out of the
# live-state diff, so ArgoCD selfHeal never fights it.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "authentik-application.fullname" . }}-upsert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "authentik-application.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: {{ .Values.syncWave | quote }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "authentik-application.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: upsert
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/scripts/upsert.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- include "authentik-application.env" . | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "authentik-application.fullname" . }}
            items:
              - key: upsert.sh
                path: upsert.sh
        - name: tmp
          emptyDir: {}
